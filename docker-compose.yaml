services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080

  firestore-emulator:
    image: google/cloud-sdk:alpine
    ports:
      - "8080:8080"
      - "4000:4000" # UI dashboard
    command: >
      sh -c "gcloud components install cloud-firestore-emulator &&
             gcloud beta emulators firestore start --host-port=0.0.0.0:8080"